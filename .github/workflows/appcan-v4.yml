name: AppCan
# Firebase / API anahtari YOK. Arka uc = bu GitHub reposu (public olmali).
# Paylasim, kaldirma, puan verme = repoda "[AppCan]" Issue acilarak olur; workflow isler.
# Admin yetkisi GitHub'da dogrulanir: Issue'yu reponun SAHIBI actiysa gecerli.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  issues:
    types: [opened]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: write

jobs:
  # ------------------------------------------------------------------
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      - name: Proje olustur
        run: |
          flutter create --org com.appcan --project-name appcan --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="AppCan"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application#' $M

      - name: Logo uret (kodla cizilir)
        run: |
          python3 -m pip install -q --break-system-packages pillow
          mkdir -p assets
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          S = 1024
          img = Image.new("RGB", (S, S)); d = ImageDraw.Draw(img)
          top, bot = (86, 170, 255), (24, 72, 200)
          for y in range(S):
              t = y / (S - 1)
              d.line([(0, y), (S, y)], fill=tuple(int(top[i] + (bot[i] - top[i]) * t) for i in range(3)))
          W = (255, 255, 255)
          d.rectangle((452, 210, 572, 540), fill=W)
          d.polygon([(322, 500), (702, 500), (512, 720)], fill=W)
          d.line([(270, 770), (270, 830), (754, 830), (754, 770)], fill=W, width=60, joint="curve")
          for x, y in ((270, 770), (754, 770), (270, 830), (754, 830)):
              d.ellipse((x - 30, y - 30, x + 30, y + 30), fill=W)
          img.save("assets/icon.png")
          EOF

      - name: pubspec.yaml
        run: |
          cat > pubspec.yaml <<'EOF'
          name: appcan
          description: AppCan uygulama magazasi
          publish_to: none
          version: 2.0.0+2
          environment:
            sdk: ">=3.3.0 <4.0.0"
          dependencies:
            flutter: { sdk: flutter }
            dio: ^5.7.0
            open_filex: ^4.5.0
            path_provider: ^2.1.4
            cached_network_image: ^3.4.1
            flutter_animate: ^4.5.0
            shared_preferences: ^2.3.2
            crypto: ^3.0.5
            url_launcher: ^6.3.0
          dev_dependencies:
            flutter_launcher_icons: ^0.14.1
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
          flutter:
            uses-material-design: true
          EOF

      - name: lib/main.dart
        run: |
          mkdir -p lib && rm -f test/widget_test.dart
          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'dart:io';
          import 'package:cached_network_image/cached_network_image.dart';
          import 'package:crypto/crypto.dart';
          import 'package:dio/dio.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_animate/flutter_animate.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';

          const kCatalog = String.fromEnvironment('CATALOG_URL');
          const kRepo = String.fromEnvironment('REPO');
          const kAdmin = 'bagov.dev';
          const kCats = ['Tümü','Oyun','Uygulama','Aksiyon','Macera','Bulmaca','Strateji','Yarış','Sosyal','Araçlar','Eğitim','Müzik','Spor','Simülasyon'];

          void main() => runApp(const AppCan());

          // ---------------- Logo (kodla çizilir) ----------------
          class LogoPainter extends CustomPainter {
            const LogoPainter();
            @override
            void paint(Canvas c, Size z) {
              final s = z.width / 1024;
              final p = Paint()..color = Colors.white;
              c.drawRect(Rect.fromLTRB(452 * s, 210 * s, 572 * s, 540 * s), p);
              c.drawPath(Path()..moveTo(322 * s, 500 * s)..lineTo(702 * s, 500 * s)..lineTo(512 * s, 720 * s)..close(), p);
              final t = Paint()
                ..color = Colors.white
                ..style = PaintingStyle.stroke
                ..strokeWidth = 60 * s
                ..strokeCap = StrokeCap.round
                ..strokeJoin = StrokeJoin.round;
              c.drawPath(Path()..moveTo(270 * s, 770 * s)..lineTo(270 * s, 830 * s)..lineTo(754 * s, 830 * s)..lineTo(754 * s, 770 * s), t);
            }
            @override
            bool shouldRepaint(_) => false;
          }

          class Logo extends StatelessWidget {
            final double size;
            const Logo({super.key, this.size = 72});
            @override
            Widget build(BuildContext c) => Container(
                  width: size, height: size,
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(size * .22),
                    gradient: const LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Color(0xFF56AAFF), Color(0xFF1848C8)]),
                  ),
                  child: const CustomPaint(painter: LogoPainter()),
                );
          }

          // ---------------- Yardımcılar ----------------
          // Paylaş / kaldır / puan ver: GitHub'da hazır doldurulmuş Issue açar.
          Future<void> openIssue(Map<String, dynamic> j) async {
            final body = '```json\n${const JsonEncoder.withIndent('  ').convert(j)}\n```';
            final u = Uri.parse('https://github.com/$kRepo/issues/new').replace(queryParameters: {
              'title': '[AppCan] ${j['action'] ?? 'submit'} ${j['package']}',
              'body': body,
            });
            await launchUrl(u, mode: LaunchMode.externalApplication);
          }

          Future<Set<String>> getFavs() async => (await SharedPreferences.getInstance()).getStringList('fav')?.toSet() ?? {};
          Future<void> toggleFav(String pkg) async {
            final p = await SharedPreferences.getInstance();
            final s = (p.getStringList('fav') ?? []).toSet();
            s.contains(pkg) ? s.remove(pkg) : s.add(pkg);
            await p.setStringList('fav', s.toList());
          }

          class AppCan extends StatelessWidget {
            const AppCan({super.key});
            @override
            Widget build(BuildContext c) => MaterialApp(
                  title: 'AppCan',
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    useMaterial3: true,
                    colorSchemeSeed: const Color(0xFF1A73E8),
                    scaffoldBackgroundColor: Colors.white,
                    appBarTheme: const AppBarTheme(backgroundColor: Colors.white, elevation: 0, scrolledUnderElevation: 0),
                  ),
                  home: const Gate(),
                );
          }

          // ---------------- Hesap (cihazda saklanır) ----------------
          class Gate extends StatefulWidget {
            const Gate({super.key});
            @override
            State<Gate> createState() => _GateState();
          }

          class _GateState extends State<Gate> {
            String? user; bool loaded = false;
            @override
            void initState() {
              super.initState();
              SharedPreferences.getInstance().then((p) => setState(() { user = p.getString('session'); loaded = true; }));
            }
            @override
            Widget build(BuildContext c) {
              if (!loaded) return const Scaffold(body: Center(child: CircularProgressIndicator()));
              return user == null
                  ? AuthPage(onDone: (u) => setState(() => user = u))
                  : HomePage(user: user!, onLogout: () async { (await SharedPreferences.getInstance()).remove('session'); setState(() => user = null); });
            }
          }

          class AuthPage extends StatefulWidget {
            final void Function(String) onDone;
            const AuthPage({super.key, required this.onDone});
            @override
            State<AuthPage> createState() => _AuthPageState();
          }

          class _AuthPageState extends State<AuthPage> {
            final mail = TextEditingController(), pass = TextEditingController();
            String h(String s) => sha256.convert(utf8.encode(s)).toString();
            void msg(String m) => ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            Future<void> go(bool register) async {
              final e = mail.text.trim().toLowerCase();
              final p = await SharedPreferences.getInstance();
              // Tek admin hesabı: açılamaz, sadece giriş yapılır.
              if (e == kAdmin) {
                if (register) return msg('Bu hesap açılamaz');
                if (pass.text != '200') return msg('Şifre yanlış');
                await p.setString('session', e);
                return widget.onDone(e);
              }
              if (!e.contains('@') || pass.text.length < 6) return msg('Geçerli e-posta ve en az 6 karakter şifre gir');
              final users = Map<String, dynamic>.from(jsonDecode(p.getString('users') ?? '{}'));
              if (register) {
                if (users.containsKey(e)) return msg('Bu e-posta zaten kayıtlı');
                users[e] = h(pass.text);
                await p.setString('users', jsonEncode(users));
              } else if (users[e] != h(pass.text)) {
                return msg('E-posta veya şifre yanlış');
              }
              await p.setString('session', e);
              widget.onDone(e);
            }
            @override
            Widget build(BuildContext c) => Scaffold(
                  body: SafeArea(
                    child: Padding(
                      padding: const EdgeInsets.all(28),
                      child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                        const Logo(size: 96).animate().scale(duration: 600.ms, curve: Curves.elasticOut),
                        const SizedBox(height: 8),
                        const Text('AppCan', style: TextStyle(fontSize: 30, fontWeight: FontWeight.w600)).animate().fadeIn(delay: 200.ms),
                        const SizedBox(height: 32),
                        TextField(controller: mail, keyboardType: TextInputType.emailAddress, decoration: const InputDecoration(labelText: 'E-posta', border: OutlineInputBorder())),
                        const SizedBox(height: 12),
                        TextField(controller: pass, obscureText: true, decoration: const InputDecoration(labelText: 'Şifre', border: OutlineInputBorder())),
                        const SizedBox(height: 16),
                        Row(children: [
                          Expanded(child: FilledButton(onPressed: () => go(false), child: const Text('Giriş yap'))),
                          const SizedBox(width: 12),
                          Expanded(child: OutlinedButton(onPressed: () => go(true), child: const Text('Kayıt ol'))),
                        ]),
                      ]).animate().fadeIn().slideY(begin: .05),
                    ),
                  ),
                );
          }

          // ---------------- Ana sayfa ----------------
          class HomePage extends StatefulWidget {
            final String user; final VoidCallback onLogout;
            const HomePage({super.key, required this.user, required this.onLogout});
            bool get admin => user == kAdmin;
            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            String q = '', cat = 'Tümü', sort = 'Puan';
            bool favOnly = false;
            Set<String> favs = {};
            late Future<List<Map<String, dynamic>>> fut = load();

            @override
            void initState() {
              super.initState();
              getFavs().then((s) => setState(() => favs = s));
            }

            Future<List<Map<String, dynamic>>> load() async {
              final r = await Dio().get(kCatalog, options: Options(responseType: ResponseType.plain, headers: {'Cache-Control': 'no-cache'}));
              return List<Map<String, dynamic>>.from(jsonDecode(r.data as String));
            }

            bool match(Map d) {
              final tags = List<String>.from(d['tags'] ?? []);
              if (cat != 'Tümü' && d['category'] != cat && !tags.contains(cat)) return false;
              if (q.isEmpty) return true;
              return '${d['name']} ${d['company']} ${d['package']} ${tags.join(' ')}'.toLowerCase().contains(q.toLowerCase());
            }

            List<Map<String, dynamic>> view(List<Map<String, dynamic>> a) {
              final l = a.where((d) => match(d) && (!favOnly || favs.contains(d['package']))).toList();
              num n(x) => (x ?? 0) as num;
              if (sort == 'Puan') {
                l.sort((x, y) => n(y['ratingAvg']).compareTo(n(x['ratingAvg'])));
              } else if (sort == 'Yeni') {
                l.sort((x, y) => n(y['added']).compareTo(n(x['added'])));
              } else {
                l.sort((x, y) => '${x['name']}'.toLowerCase().compareTo('${y['name']}'.toLowerCase()));
              }
              return l;
            }

            @override
            Widget build(BuildContext c) => Scaffold(
                  appBar: AppBar(
                    title: Row(children: [
                      const Logo(size: 30),
                      const SizedBox(width: 10),
                      const Text('AppCan', style: TextStyle(fontWeight: FontWeight.w600)),
                      if (widget.admin) const Padding(padding: EdgeInsets.only(left: 8), child: Chip(label: Text('admin'), visualDensity: VisualDensity.compact)),
                    ]),
                    actions: [
                      IconButton(icon: Icon(favOnly ? Icons.favorite : Icons.favorite_border), onPressed: () => setState(() => favOnly = !favOnly)),
                      PopupMenuButton<String>(
                        icon: const Icon(Icons.sort),
                        onSelected: (v) => setState(() => sort = v),
                        itemBuilder: (_) => [for (final s in ['Puan', 'Yeni', 'Ad']) PopupMenuItem(value: s, child: Text('Sırala: $s'))],
                      ),
                      IconButton(icon: const Icon(Icons.refresh), onPressed: () => setState(() => fut = load())),
                      IconButton(icon: const Icon(Icons.logout), onPressed: widget.onLogout),
                    ],
                  ),
                  floatingActionButton: FloatingActionButton.extended(
                    icon: const Icon(Icons.add),
                    label: const Text('Paylaş'),
                    onPressed: () => Navigator.push(c, MaterialPageRoute(builder: (_) => SharePage(admin: widget.admin))),
                  ),
                  body: Column(children: [
                    Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 16),
                      child: TextField(
                        onChanged: (v) => setState(() => q = v),
                        decoration: InputDecoration(hintText: 'Uygulama, oyun, şirket, etiket ara', prefixIcon: const Icon(Icons.search), filled: true, border: OutlineInputBorder(borderRadius: BorderRadius.circular(28), borderSide: BorderSide.none)),
                      ),
                    ),
                    SizedBox(
                      height: 56,
                      child: ListView(scrollDirection: Axis.horizontal, padding: const EdgeInsets.symmetric(horizontal: 12), children: [
                        for (final k in kCats)
                          Padding(padding: const EdgeInsets.all(6), child: ChoiceChip(label: Text(k), selected: cat == k, onSelected: (_) => setState(() => cat = k))),
                      ]),
                    ),
                    Expanded(
                      child: FutureBuilder<List<Map<String, dynamic>>>(
                        future: fut,
                        builder: (c, s) {
                          if (s.hasError) return const Center(child: Text('Katalog yüklenemedi.\nHenüz uygulama eklenmemiş olabilir.', textAlign: TextAlign.center));
                          if (!s.hasData) return const Center(child: CircularProgressIndicator());
                          final l = view(s.data!);
                          if (l.isEmpty) return const Center(child: Text('Sonuç yok'));
                          return ListView.builder(
                            padding: const EdgeInsets.only(bottom: 90),
                            itemCount: l.length,
                            itemBuilder: (c, i) {
                              final d = l[i];
                              return ListTile(
                                leading: ClipRRect(borderRadius: BorderRadius.circular(12), child: CachedNetworkImage(imageUrl: d['icon'] ?? '', width: 56, height: 56, fit: BoxFit.cover, errorWidget: (_, __, ___) => const Icon(Icons.apps, size: 40))),
                                title: Text(d['name'] ?? ''),
                                subtitle: Text('${d['company'] ?? ''}  •  ${d['category'] ?? ''}'),
                                trailing: Row(mainAxisSize: MainAxisSize.min, children: [
                                  if (favs.contains(d['package'])) const Icon(Icons.favorite, size: 16, color: Colors.redAccent),
                                  const SizedBox(width: 6),
                                  const Icon(Icons.star, size: 16, color: Colors.amber),
                                  Text('${d['ratingAvg'] ?? 0}'),
                                ]),
                                onTap: () => Navigator.push(c, MaterialPageRoute(builder: (_) => DetailPage(d: d, user: widget.user, admin: widget.admin)))
                                    .then((_) => getFavs().then((s) => setState(() => favs = s))),
                              ).animate().fadeIn(delay: (40 * i).ms).slideX(begin: .08);
                            },
                          );
                        },
                      ),
                    ),
                  ]),
                );
          }

          // ---------------- Proje paylaş ----------------
          class SharePage extends StatefulWidget {
            final bool admin;
            const SharePage({super.key, required this.admin});
            @override
            State<SharePage> createState() => _SharePageState();
          }

          class _SharePageState extends State<SharePage> {
            static const fields = [
              ['name', 'Uygulama adı *'], ['company', 'Şirket adı *'], ['package', 'Paket adı * (örn. com.sirket.app)'],
              ['icon', 'Kapak/logo bağlantısı (https)'], ['tags', 'Etiketler (virgülle)'], ['description', 'Açıklama'],
              ['ageRating', 'Yaş sınırı (örn. 3, 12, 18)'], ['apkUrl', 'APK bağlantısı (https)'], ['xapkUrl', 'XAPK bağlantısı (https)'], ['ipaUrl', 'IPA bağlantısı (https)'],
            ];
            final ctl = {for (final f in fields) f[0]: TextEditingController()};
            String category = 'Uygulama';
            bool embedded = false;
            void msg(String m) => ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));

            void send() {
              String v(String k) => ctl[k]!.text.trim();
              if (v('name').isEmpty || v('company').isEmpty || v('package').isEmpty) return msg('Ad, şirket ve paket adı zorunlu');
              if (v('icon').isEmpty && !embedded) return msg('Kapak ekle ya da "dosyada logo var" seç');
              if (v('apkUrl').isEmpty && v('xapkUrl').isEmpty && v('ipaUrl').isEmpty) return msg('En az bir dosya bağlantısı ekle');
              if (v('company').toLowerCase() == kAdmin && !widget.admin) return msg('Bu şirket adı kullanılamaz');
              openIssue({
                'action': 'submit',
                for (final f in fields) if (f[0] != 'tags') f[0]: v(f[0]),
                'tags': v('tags').split(',').map((e) => e.trim()).where((e) => e.isNotEmpty).toList(),
                'category': category,
                'hasEmbeddedIcon': embedded,
              });
            }

            @override
            Widget build(BuildContext c) => Scaffold(
                  appBar: AppBar(title: const Text('Proje paylaş')),
                  body: ListView(padding: const EdgeInsets.all(16), children: [
                    const Text('Paylaş\'a basınca GitHub açılır; "Submit new issue" de. Tarama ~20 sn sürer, sonra yayında.', style: TextStyle(color: Colors.grey)),
                    const SizedBox(height: 12),
                    for (final f in fields)
                      Padding(padding: const EdgeInsets.only(bottom: 10), child: TextField(controller: ctl[f[0]], maxLines: f[0] == 'description' ? 3 : 1, decoration: InputDecoration(labelText: f[1], border: const OutlineInputBorder()))),
                    const Text('Kategori', style: TextStyle(fontWeight: FontWeight.w600)),
                    Wrap(spacing: 6, children: [for (final k in kCats.skip(1)) ChoiceChip(label: Text(k), selected: category == k, onSelected: (_) => setState(() => category = k))]),
                    CheckboxListTile(value: embedded, onChanged: (v) => setState(() => embedded = v!), title: const Text('Dosyanın içinde kendi logosu var')),
                    FilledButton.icon(icon: const Icon(Icons.send), label: const Text('Paylaş'), onPressed: send),
                  ]),
                );
          }

          // ---------------- Paralel indirme ----------------
          Future<String> fastDownload(String url, String name, void Function(double) onP) async {
            final dir = await getTemporaryDirectory();
            final path = '${dir.path}/$name';
            final dio = Dio();
            int len = 0; bool ranges = false;
            try {
              final h = await dio.head(url);
              len = int.tryParse(h.headers.value('content-length') ?? '') ?? 0;
              ranges = h.headers.value('accept-ranges') == 'bytes';
            } catch (_) {}
            if (len == 0 || !ranges) {
              await dio.download(url, path, onReceiveProgress: (r, t) => onP(t > 0 ? r / t : 0));
              return path;
            }
            const n = 6;
            final part = len ~/ n;
            final got = List<int>.filled(n, 0);
            await Future.wait(List.generate(n, (i) async {
              final s = i * part, e = i == n - 1 ? len - 1 : s + part - 1;
              await dio.download(url, '$path.$i',
                  options: Options(headers: {'range': 'bytes=$s-$e'}),
                  onReceiveProgress: (r, _) { got[i] = r; onP(got.reduce((a, b) => a + b) / len); });
            }));
            final out = File(path).openWrite();
            for (var i = 0; i < n; i++) {
              await out.addStream(File('$path.$i').openRead());
              await File('$path.$i').delete();
            }
            await out.close();
            return path;
          }

          // ---------------- Detay ----------------
          class DetailPage extends StatefulWidget {
            final Map<String, dynamic> d; final String user; final bool admin;
            const DetailPage({super.key, required this.d, required this.user, required this.admin});
            @override
            State<DetailPage> createState() => _DetailPageState();
          }

          class _DetailPageState extends State<DetailPage> {
            double prog = 0; bool downloading = false, fav = false;
            int stars = 5; final txt = TextEditingController();
            List<Map<String, dynamic>> mine = [];
            Map<String, dynamic> get d => widget.d;
            String get key => 'rv:${d['package']}';

            @override
            void initState() {
              super.initState();
              getFavs().then((s) => setState(() => fav = s.contains(d['package'])));
              SharedPreferences.getInstance().then((p) => setState(() => mine = (p.getStringList(key) ?? []).map((e) => Map<String, dynamic>.from(jsonDecode(e))).toList()));
            }

            String? pick() => Platform.isIOS ? d['ipaUrl'] : (d['apkUrl'] ?? d['xapkUrl']);

            Future<void> download() async {
              final url = pick();
              if (url == null || url.isEmpty) return ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Bu cihaz için sürüm yok')));
              setState(() { downloading = true; prog = 0; });
              try {
                final ext = url.split('?').first.split('.').last;
                final p = await fastDownload(url, '${d['package']}.$ext', (v) { if (mounted) setState(() => prog = v); });
                await OpenFilex.open(p);
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('İndirme hatası: $e')));
              } finally { if (mounted) setState(() => downloading = false); }
            }

            Future<void> sendReview() async {
              final p = await SharedPreferences.getInstance();
              mine.insert(0, {'user': widget.user, 'stars': stars, 'text': txt.text.trim()});
              await p.setStringList(key, mine.map(jsonEncode).toList());
              txt.clear();
              setState(() {});
            }

            Future<void> rate() async {
              double v = 5;
              final ok = await showDialog<bool>(
                context: context,
                builder: (c) => StatefulBuilder(
                  builder: (c, st) => AlertDialog(
                    title: const Text('Puan ver'),
                    content: Column(mainAxisSize: MainAxisSize.min, children: [
                      Text(v.toStringAsFixed(1), style: const TextStyle(fontSize: 28)),
                      Slider(value: v, min: 0, max: 5, divisions: 50, onChanged: (x) => st(() => v = x)),
                    ]),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(c, false), child: const Text('Vazgeç')),
                      FilledButton(onPressed: () => Navigator.pop(c, true), child: const Text('Gönder')),
                    ],
                  ),
                ),
              );
              if (ok == true) openIssue({'action': 'rate', 'package': d['package'], 'ratingAvg': double.parse(v.toStringAsFixed(1))});
            }

            @override
            Widget build(BuildContext c) {
              final all = [...mine, ...List<Map<String, dynamic>>.from(d['reviews'] ?? [])];
              return Scaffold(
                appBar: AppBar(actions: [
                  IconButton(
                    icon: Icon(fav ? Icons.favorite : Icons.favorite_border, color: fav ? Colors.redAccent : null),
                    onPressed: () async { await toggleFav(d['package']); setState(() => fav = !fav); },
                  ),
                ]),
                body: ListView(padding: const EdgeInsets.all(16), children: [
                  Row(children: [
                    ClipRRect(borderRadius: BorderRadius.circular(20), child: CachedNetworkImage(imageUrl: d['icon'] ?? '', width: 96, height: 96, fit: BoxFit.cover, errorWidget: (_, __, ___) => const Icon(Icons.apps, size: 64))),
                    const SizedBox(width: 16),
                    Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text(d['name'] ?? '', style: const TextStyle(fontSize: 22, fontWeight: FontWeight.w600)),
                      Text(d['company'] ?? '', style: TextStyle(color: Theme.of(c).colorScheme.primary)),
                      Text(d['package'] ?? '', style: const TextStyle(fontSize: 12, color: Colors.grey)),
                    ])),
                  ]).animate().fadeIn().slideY(begin: .05),
                  const SizedBox(height: 16),
                  Row(children: [
                    const Icon(Icons.star, color: Colors.amber),
                    Text(' ${d['ratingAvg'] ?? 0}  (${d['ratingCount'] ?? 0} değerlendirme)'),
                    const Spacer(),
                    if (d['ageRating'] != null) Chip(label: Text('${d['ageRating']}+')),
                  ]),
                  Wrap(spacing: 6, children: [for (final t in List<String>.from(d['tags'] ?? [])) Chip(label: Text(t), visualDensity: VisualDensity.compact)]),
                  const SizedBox(height: 12),
                  downloading
                      ? Column(children: [LinearProgressIndicator(value: prog), const SizedBox(height: 4), Text('%${(prog * 100).toInt()}')])
                      : FilledButton.icon(icon: const Icon(Icons.download), label: Text(Platform.isIOS ? 'İndir (.ipa)' : 'İndir'), onPressed: download),
                  if (widget.admin) ...[
                    const SizedBox(height: 8),
                    Row(children: [
                      Expanded(child: OutlinedButton.icon(icon: const Icon(Icons.star_half), label: const Text('Puan ver'), onPressed: rate)),
                      const SizedBox(width: 8),
                      Expanded(child: OutlinedButton.icon(icon: const Icon(Icons.delete_outline), label: const Text('Kaldır'), onPressed: () => openIssue({'action': 'remove', 'package': d['package']}))),
                    ]),
                  ],
                  const SizedBox(height: 12),
                  Text(d['description'] ?? ''),
                  const Divider(height: 32),
                  const Text('Yorum yaz (cihazında saklanır)', style: TextStyle(fontWeight: FontWeight.w600)),
                  Row(children: [for (var i = 1; i <= 5; i++) IconButton(onPressed: () => setState(() => stars = i), icon: Icon(i <= stars ? Icons.star : Icons.star_border, color: Colors.amber))]),
                  TextField(controller: txt, maxLines: 3, decoration: const InputDecoration(border: OutlineInputBorder(), hintText: 'Düşüncelerin')),
                  Align(alignment: Alignment.centerRight, child: TextButton(onPressed: sendReview, child: const Text('Kaydet'))),
                  for (final r in all)
                    ListTile(
                      title: Text('${r['user']}'),
                      subtitle: Text('${r['text']}'),
                      trailing: Row(mainAxisSize: MainAxisSize.min, children: [const Icon(Icons.star, size: 14, color: Colors.amber), Text('${r['stars']}')]),
                    ),
                ]),
              );
            }
          }
          EOF

      - name: APK derle
        run: |
          set -o pipefail
          flutter pub get
          dart run flutter_launcher_icons
          echo "=== DART HATALARI (varsa) ==="
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -i "error" || true
          echo "=== DERLEME ==="
          flutter build apk --release \
            --dart-define=CATALOG_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/catalog.json \
            --dart-define=REPO=${{ github.repository }} 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: AppCan-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: HATA OZETI (derleme basarisizsa)
        if: failure()
        run: grep -n -iE "error|failed|exception|not found|undefined" build.log | head -60 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

  # ------------------------------------------------------------------
  # Issue acilinca aninda calisir. Zamanlanmis calismada ~4 dk boyunca
  # her 20 saniyede bir: acik Issue'lari isler + bekleyen uygulamalari tarar.
  review:
    if: github.event_name == 'schedule' || github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: appcan-review
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Isle, tara, yayinla
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          VT: ${{ secrets.VT_API_KEY }}
        run: |
          python3 -m pip install -q --break-system-packages requests
          mkdir -p apps
          cat > tool.py <<'EOF'
          import os, re, json, glob, time, shutil, hashlib, subprocess, requests

          OWNER = os.environ["OWNER"].lower()
          VT = os.environ.get("VT", "")
          ADMIN_CO = "bagov.dev"
          PKG = re.compile(r"^[a-zA-Z][a-zA-Z0-9_.]{2,100}$")
          URLK = ("icon", "apkUrl", "xapkUrl", "ipaUrl")
          MAX_BYTES = 300 * 1024 * 1024

          def gh(*a):
              return subprocess.run(["gh", *a], capture_output=True, text=True)

          def clean(v, n=100):
              return str(v or "").strip()[:n]

          def parse(body):
              m = re.search(r"```(?:json)?\s*(\{.*?\})\s*```", body or "", re.S)
              return json.loads(m.group(1) if m else (body or "").strip())

          def save(path, d):
              json.dump(d, open(path, "w"), ensure_ascii=False, indent=2)

          def handle(issue):
              author = issue["author"]["login"].lower()
              admin = author == OWNER          # yetki GitHub hesabindan dogrulanir
              try:
                  j = parse(issue["body"])
              except Exception:
                  return "JSON okunamadi"
              act = j.get("action", "submit")
              pkg = clean(j.get("package"), 101)
              if not PKG.match(pkg):
                  return "Gecersiz paket adi"
              path = f"apps/{pkg}.json"
              old = json.load(open(path)) if os.path.exists(path) else None

              if act == "remove":
                  if not old: return "Uygulama yok"
                  if not (admin or old.get("owner") == author): return "Yetkin yok"
                  os.remove(path); return "Kaldirildi"

              if act == "rate":
                  if not admin: return "Sadece admin puan verebilir"
                  if not old: return "Uygulama yok"
                  try: r = float(j["ratingAvg"])
                  except Exception: return "ratingAvg gerekli"
                  if not 0 <= r <= 5: return "Puan 0-5 arasi olmali"
                  old["ratingAvg"] = round(r, 1)
                  if "ratingCount" in j: old["ratingCount"] = max(0, int(j["ratingCount"]))
                  save(path, old); return f"Puan {r} verildi"

              if act != "submit": return "Bilinmeyen islem"
              if old and not (admin or old.get("owner") == author):
                  return "Bu paket baska birine ait"
              d = {"package": pkg}
              for k in ("name", "company", "category"): d[k] = clean(j.get(k))
              d["description"] = clean(j.get("description"), 1000)
              d["tags"] = [clean(t, 30) for t in (j.get("tags") if isinstance(j.get("tags"), list) else [])[:20] if clean(t, 30)]
              try: d["ageRating"] = max(0, min(21, int(j.get("ageRating"))))
              except Exception: d["ageRating"] = 0
              d["hasEmbeddedIcon"] = bool(j.get("hasEmbeddedIcon"))
              for k in URLK:
                  u = clean(j.get(k), 1000)
                  if u and not u.startswith("https://"): return f"{k} https ile baslamali"
                  d[k] = u
              if d["company"].lower() == ADMIN_CO and not admin:
                  return "bagov.dev sirket adi sadece admine ait"
              d["owner"] = author
              d["status"] = "pending"
              d["added"] = old.get("added") if old else int(time.time())
              # puan/yorum paylasan kisi tarafindan degistirilemez
              d["ratingAvg"] = old.get("ratingAvg", 0) if old else 0
              d["ratingCount"] = old.get("ratingCount", 0) if old else 0
              d["reviews"] = old.get("reviews", []) if old else []
              save(path, d); return "Alindi, taraniyor"

          def process_issues():
              r = gh("issue", "list", "--state", "open", "--json", "number,title,body,author", "--limit", "30")
              try: issues = json.loads(r.stdout or "[]")
              except Exception: return
              for it in issues:
                  if not it["title"].startswith("[AppCan]"): continue
                  try: msg = handle(it)
                  except Exception as e: msg = f"Hata: {e}"
                  gh("issue", "comment", str(it["number"]), "--body", msg)
                  gh("issue", "close", str(it["number"]))
                  print("issue", it["number"], msg)

          def ensure_clam():
              if shutil.which("clamscan"): return
              subprocess.run("sudo apt-get update -qq && sudo apt-get install -y -qq clamav && sudo systemctl stop clamav-freshclam; sudo freshclam --quiet", shell=True)

          def scan(d):
              miss = [k for k in ("name", "company", "package") if not d.get(k)]
              if not d.get("icon") and not d.get("hasEmbeddedIcon"): miss.append("icon")
              if miss: return "rejected", "Eksik alan: " + ", ".join(miss)
              urls = [d[k] for k in ("apkUrl", "xapkUrl", "ipaUrl") if d.get(k)]
              if not urls: return "rejected", "Dosya baglantisi yok"
              ensure_clam()
              for i, u in enumerate(urls):
                  p = f"/tmp/f{i}.bin"
                  try:
                      size = 0
                      with requests.get(u, stream=True, timeout=120) as r:
                          r.raise_for_status()
                          with open(p, "wb") as o:
                              for ch in r.iter_content(1 << 20):
                                  size += len(ch)
                                  if size > MAX_BYTES: return "rejected", "Dosya 300 MB'tan buyuk"
                                  o.write(ch)
                  except Exception as e:
                      return "rejected", f"Indirilemedi: {e}"
                  out = subprocess.run(["clamscan", "--no-summary", p], capture_output=True, text=True).stdout
                  if "FOUND" in out: return "rejected", "ClamAV: " + out.strip().splitlines()[0]
                  if VT:
                      h = hashlib.sha256(open(p, "rb").read()).hexdigest()
                      vr = requests.get("https://www.virustotal.com/api/v3/files/" + h, headers={"x-apikey": VT})
                      if vr.status_code == 200:
                          st = vr.json()["data"]["attributes"]["last_analysis_stats"]
                          if st.get("malicious", 0) >= 3: return "rejected", f"VirusTotal: {st['malicious']} motor zararli"
              return "approved", "Temiz"

          process_issues()
          approved = []
          for p in sorted(glob.glob("apps/*.json")):
              d = json.load(open(p))
              if d.get("status", "pending") == "pending":
                  d["status"], d["scanNote"] = scan(d)
                  save(p, d); print(p, d["status"], d["scanNote"])
              if d["status"] == "approved": approved.append(d)
          approved.sort(key=lambda x: -x.get("added", 0))
          json.dump(approved, open("catalog.json", "w"), ensure_ascii=False, indent=1)
          EOF

          git config user.name "appcan-bot"
          git config user.email "bot@users.noreply.github.com"
          N=1
          if [ "${{ github.event_name }}" = "schedule" ]; then N=12; fi
          for i in $(seq 1 $N); do
            python3 tool.py
            git add -A apps catalog.json
            if ! git diff --cached --quiet; then
              git commit -qm "AppCan: guncelleme"
              git pull --rebase -q || true
              git push -q || true
            fi
            if [ $i -lt $N ]; then sleep 20; fi
          done
